[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "mql5-codegraph"
version = "0.3.0"
description = "Evidence-backed static code graph indexer for MQL5 repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "MQL5 CodeGraph Contributors" }]
keywords = ["mql5", "metatrader", "static-analysis", "codegraph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.scripts]
mql5-codegraph = "mql5_codegraph.cli:main"
mql5-codegraph-mcp = "mql5_codegraph.mcp.server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]
reference = ["pypdf>=6.10,<7", "pypdfium2>=5.7.1,<6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mql5_codegraph = ["web_static/**"]
